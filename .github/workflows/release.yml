name: Build macOS app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build JAR
        run: mvn -B package

      - name: Package as Mac app
        run: |
          # Turn icon.png into a macOS .icns icon
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size src/main/resources/icon.png --out icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) src/main/resources/icon.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns

          mkdir dist-input
          JAR=$(ls target/*.jar | grep -v original- | head -1)
          cp "$JAR" dist-input/
          jpackage --type dmg \
            --name CSJokes \
            --app-version "${GITHUB_REF_NAME#v}" \
            --icon icon.icns \
            --input dist-input \
            --main-jar "$(basename "$JAR")" \
            --main-class org.example.Main \
            --java-options "-Dapple.awt.UIElement=true" \
            --dest out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg